name: 湖州环评公示采集 → Pages

# 工作日（周一~周五）北京时间早上 7:00
# 北京时间 = UTC+8，所以 07:00 CST 是前一天 23:00 UTC：周日~周四
on:
  schedule:
    - cron: '0 23 * * 0-4'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一次定时触发排队时，只保留最新一个，避免并发部署冲突
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 装依赖
        run: pip install requests beautifulsoup4

      - name: 采集
        run: python3 monitor.py

      - name: 汇总
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('data/items.json', encoding='utf-8'))
          items = d['items'] if isinstance(d, dict) else d
          atts = sum(len(p.get('附件链接', [])) for i in items for p in i.get('项目', []))
          print(f'::notice::公告 {len(items)} 条 / 附件 {atts} 个')
          PY

      - name: 打包成 KV bulk（可选路线用）
        run: python3 tools/export_kv.py

      - name: 存档原始数据
        uses: actions/upload-artifact@v4
        with:
          name: huzhou-epi-${{ github.run_number }}
          retention-days: 30
          path: |
            data/items.json
            kv-bulk.json

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      # 看板是自包含单文件（reports/index.html，数据已内联），整目录上传即可
      - name: 上传看板
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports

      - name: 部署到 Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 可选：如果配了 CF_* 三个 secret，就顺便灌一份到 Cloudflare KV
      # 没配就跳过（secrets 上下文不能用在 if: 里，所以在 shell 里判断）
      - name: （可选）同步到 Cloudflare KV
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "未配置 CF_API_TOKEN，跳过 KV 同步（不影响 Pages）"
            exit 0
          fi
          python3 tools/push_kv.py
