name: 湖州环评公示采集

# 工作日（周一~周五）北京时间早上 7:00 跑一次
# 北京时间 = UTC+8，所以 07:00 CST 对应前一天 23:00 UTC：周日~周四
on:
  schedule:
    - cron: '0 23 * * 0-4'
  workflow_dispatch:          # 允许在 Actions 页面手动点一次
    inputs:
      push_kv:
        description: '是否把结果推送到 Cloudflare KV'
        required: false
        default: 'true'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 装依赖
        run: pip install requests beautifulsoup4

      - name: 采集
        run: python3 monitor.py

      - name: 汇总
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('data/items.json', encoding='utf-8'))
          items = d['items'] if isinstance(d, dict) else d
          atts = sum(len(p.get('附件链接', [])) for i in items for p in i.get('项目', []))
          print(f'公告 {len(items)} 条，附件 {atts} 个')
          print(f'::notice::公告 {len(items)} 条 / 附件 {atts} 个')
          PY

      - name: 打包成 KV bulk
        run: python3 tools/export_kv.py

      - name: 推送到 Cloudflare KV
        if: ${{ github.event.inputs.push_kv != 'false' }}
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python3 tools/push_kv.py

      - name: 存档看板和原始数据
        uses: actions/upload-artifact@v4
        with:
          name: huzhou-epi-${{ github.run_number }}
          retention-days: 30
          path: |
            reports/index.html
            data/items.json
            kv-bulk.json
